metadata:
    name: helpdesk
    version: 1.0.0
core_schema:
    vertex_config:
        vertices:
        -   name: Customer
            description: A customer account.
            semantics:
                synonyms: [client]
            properties:
            -   name: account
                type: STRING
            -   name: email
                type: STRING
            -   name: name
                type: STRING
            identity: [account]
            secondary_identities:
            -   name: by_email
                fields: [email]
        -   name: Agent
            description: A support agent.
            properties:
            -   name: handle
                type: STRING
            -   name: name
                type: STRING
            identity: [handle]
        -   name: Ticket
            description: A support ticket.
            semantics:
                synonyms: [case, issue]
            properties:
            -   name: number
                type: STRING
            -   name: title
                type: STRING
            -   name: severity
                type: INT
            -   name: opened
                type: DATETIME
            -   name: resolved
                type: BOOL
            -   name: wait
                type: FLOAT
                semantics:
                    unit: h
            identity: [number]
        -   name: Product
            description: A product the company sells.
            properties:
            -   name: sku
                type: STRING
            -   name: name
                type: STRING
            identity: [sku]
        -   name: Tag
            description: A label put on tickets.
            properties:
            -   name: label
                type: STRING
            hash_identity_properties: [label]
        -   name: Escalation
            description: A ticket handed to a higher support tier.
            properties:
            -   name: reason
                type: STRING
            assigned: true
        -   name: Comment
            description: A comment written on a ticket.
            properties:
            -   name: body
                type: STRING
            blank: true
    edge_config:
        edges:
        -   source: Customer
            target: Ticket
            relation: RAISED
        -   source: Agent
            target: Ticket
            relation: HANDLES
            properties:
            -   name: since
                type: DATETIME
        -   source: Ticket
            target: Product
            relation: ABOUT
        -   source: Ticket
            target: Ticket
            relation: DUPLICATE_OF
        -   source: Ticket
            target: Tag
            relation: TAGGED
        -   source: Escalation
            target: Ticket
            relation: ESCALATES
        -   source: Agent
            target: Agent
            relation: MENTORS
        -   source: Comment
            target: Ticket
            relation: "ON"
