name: tests

on:
    pull_request:
    push:
        branches: [main]
    schedule:
        # Daily: catches a new graflo release that breaks this package.
    -   cron: '35 5 * * *'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

# Development uses graflo from a sibling checkout (`tool.uv.sources`); CI has
# none, so every sync passes `--no-sources` and resolves graflo from PyPI.

jobs:
    # Guards the packaged artifact: a plain install must import and stay light.
    import-smoke:
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v7
        -   name: Install uv
            uses: astral-sh/setup-uv@v10.2.0
            with:
                version: "0.12.21"
        -   name: Build wheel
            run: uv build --wheel --no-sources --out-dir dist
        -   name: Install the wheel
            run: |
                uv venv --python 3.12 /tmp/base-install
                VIRTUAL_ENV=/tmp/base-install uv pip install dist/*.whl
        -   name: Import the documented entry points, loading nothing heavy
            run: |
                /tmp/base-install/bin/python -c "
                import sys
                from schemacast import SchemaCaster, load_schema, read_episodes, write_cast
                forbidden = ['langchain', 'langgraph', 'torch', 'numpy', 'pandas', 'rdflib']
                leaked = [name for name in forbidden if name in sys.modules]
                assert not leaked, f'imported on a plain install: {leaked}'
                print('import OK')
                "
        -   name: Console scripts resolve
            run: |
                /tmp/base-install/bin/schemacast --help
                /tmp/base-install/bin/schemacast-bench --help
                /tmp/base-install/bin/schemacast sheet --schema examples/tickets/schema.yaml > /dev/null

    unit:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # PRs and non-main pushes: 3.12 only. Pushes to main also run 3.11 and 3.13.
                python-version: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON('["3.11", "3.12", "3.13"]') || fromJSON('["3.12"]') }}
        env:
            UV_PYTHON: ${{ matrix.python-version }}
        steps:
        -   uses: actions/checkout@v7
        -   name: Install uv
            uses: astral-sh/setup-uv@v10.2.0
            with:
                version: "0.12.21"
                enable-cache: true
        -   name: Install dependencies
            run: uv sync --no-sources --group dev
        -   name: Type check
            if: matrix.python-version == '3.12'
            run: uv run --no-sources ty check schemacast test
        # No model is called: tests use a scripted endpoint, and the `llm` and
        # `neo4j` markers are skipped without --run-llm / --run-neo4j.
        -   name: Run tests
            run: uv run --no-sources pytest
            env:
                PYTHONUNBUFFERED: '1'

    # Both ends of the declared graflo range: the floor it promises to support
    # and the newest release it admits. Not on PRs.
    graflo-range:
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                graflo: [floor, latest]
        env:
            UV_PYTHON: '3.12'
        steps:
        -   uses: actions/checkout@v7
        -   name: Install uv
            uses: astral-sh/setup-uv@v10.2.0
            with:
                version: "0.12.21"
                enable-cache: true
        -   name: Install dependencies
            run: uv sync --no-sources --group dev
        -   name: Select graflo
            run: |
                range=$(sed -nE 's/^ *"(graflo>=[^"]+)",?$/\1/p' pyproject.toml)
                floor=$(sed -nE 's/^ *"graflo>=([0-9.]+).*/\1/p' pyproject.toml)
                test -n "$range" && test -n "$floor"
                if [ "${{ matrix.graflo }}" = floor ]; then
                    uv pip install --python .venv "graflo==$floor"
                else
                    uv pip install --python .venv --upgrade-package graflo "$range"
                fi
                uv run --no-sync python -c "import importlib.metadata as m; print('graflo', m.version('graflo'))"
        -   name: Run tests
            run: uv run --no-sync pytest
            env:
                PYTHONUNBUFFERED: '1'
