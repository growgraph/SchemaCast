name: Build GitHub Pages
on:
    push:
        branches:
        -   main
        paths:
        -   'docs/**'
        -   'properdocs.yml'
        -   'pyproject.toml'
        -   'uv.lock'
        -   'schemacast/**'
    # A pull request builds the site strictly but does not deploy it.
    pull_request:
        paths:
        -   'docs/**'
        -   'properdocs.yml'
        -   'pyproject.toml'
        -   'uv.lock'
        -   'schemacast/**'
    workflow_dispatch:

permissions:
    contents: read

# One deployment at a time; a newer push queues instead of cancelling one in flight.
# Each pull request builds in its own group.
concurrency:
    group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        -   name: Checkout code
            uses: actions/checkout@v7
        -   name: Install uv
            uses: astral-sh/setup-uv@v10.2.0
            with:
                version: "0.12.21"
                enable-cache: true
        -   name: Install dependencies
            run: uv sync --no-sources --group docs
        -   name: Build site
            run: uv run --no-sources properdocs build --strict --site-dir _site
        -   name: Upload Pages artifact
            if: github.event_name != 'pull_request'
            uses: actions/upload-pages-artifact@v5
            with:
                path: _site

    deploy:
        needs: build
        if: github.event_name != 'pull_request'
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
        -   name: Deploy to GitHub Pages
            id: deployment
            uses: actions/deploy-pages@v5
