[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
bench = []
dev = [
  "fastapi>=0.134.0,<1",
  "jsonschema>=4.23.0",
  "pre-commit>=4.6.2",
  "pytest-asyncio>=1.2.0",
  "pytest>=9.0.2",
  "ty>=0.0.86",
  "uvicorn>=0.30.0,<1"
]
docs = [
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-glightbox>=0.4.0",
  "mkdocs-literate-nav>=0.6.2",
  "mkdocs-material>=9.6.14",
  "mkdocstrings-python>=2.0.3",
  "mkdocstrings[python]>=0.29.1",
  "properdocs>=1.6.7"
]

[project]
authors = [{ email = "alexander@growgraph.dev", name = "Alexander Belikov" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing"
]
dependencies = [
  "click>=8.2.0,<9",
  "graflo>=1.18.0,<2",
  "openai>=1.109.0,<3",
  "pydantic-settings>=2.12.0",
  "pydantic>=2.12.5",
  "pyyaml>=6.0"
]
description = "Text to labeled property graph against a governed GraFlo schema"
keywords = ["graflo", "information-extraction", "knowledge-graph", "llm", "property-graph"]
license = "Apache-2.0"
name = "schemacast"
readme = "README.md"
requires-python = ">=3.11"
version = "0.3.0"

[project.optional-dependencies]
# Reserved: the dense retrieval lane.
embed = []
# `schemacast serve`.
server = ["fastapi>=0.134.0,<1", "uvicorn[standard]>=0.30.0,<1"]

[project.scripts]
schemacast = "schemacast.cli:main"
schemacast-bench = "schemacast.bench.cli:main"

[project.urls]
Documentation = "https://growgraph.github.io/SchemaCast/"
Issues = "https://github.com/growgraph/SchemaCast/issues"
Repository = "https://github.com/growgraph/SchemaCast"

[tool.hatch.build.targets.wheel]
packages = ["schemacast"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
# A graflo deprecation fails the suite, so it is fixed before graflo removes the name.
filterwarnings = ["error:.*is deprecated since graflo:DeprecationWarning"]
markers = [
  "llm: exercises a real language model (skipped unless --run-llm)",
  "neo4j: wipes the Neo4j named by NEO4J_URI (skipped unless --run-neo4j)"
]
testpaths = ["test"]

[tool.ruff.lint]
ignore = ["E722"]

[tool.uv.sources]
graflo = { editable = true, path = "../graflo" }
