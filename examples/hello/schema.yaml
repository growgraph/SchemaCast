# Companies, who runs them, and who bought whom.
name: deals
version: 1.0.0
types:
    Company:
        about: A company.
        aka: [firm]
        key: name
        fields: {name: str, sector: str, city: str}
    Person:
        about: A person.
        key: name
        fields: {name: str}
relations:
